front:
  text: 三洞修道儀楹十夫道以元精一氣陶育三才爰及萬物有情無情咸稟此氣得之者外可以輔元化內可以登至真昧之者反淳以為漓攬清以為濁汨亂神性淪為下鬼何神仙之可冀乎雖大象無形不可得於視聽然悟證者實資於傳授按上清大有妙經至道始自玄聖傳與神真神真傳與靈仙此三真口口相授未有文字至赤明開圖方著文篆逮龍漢延康漸降靈寶金闕玉格自是乃睹出教之科文此時太平靈寶行於諸天洎列紀君始傳於黃帝靈寶既隱封五符於鍾山至大禹理水受之疏逹之後復藏之於石碽震水所謂靈寶或隱或顯是也後聖黃老帝君傳洞神經誥符圖號黃老道德於世世之隱逸者默修其道洞神漸替東漢末三天法師張君方受太上正一科法先是蜀當鬼宿之分下有二十四治隂司以調二十四氣北邙一治在洛陽者以伊闕為陸渾戎地以鎮隂都也後為六天魔鬼占據號曰鬼營天師以正一法而降制焉至今列為隂局鬼為隂吏天師之裔世傳一人即信州龍虎山張家也大約此教盛於吳蜀迄于魏世有嵩嶽寇謙之天師復大弘闡歷于唐季其間道業彰灼者江左即有若簡寂先生陸公修靜中宇即有若隱真趙先生潘天師澄源李先生司馬天師宗元先生吳天師牛先生葉孤雲葉廣寒二天師希和李先生皆傳教之光明者具載道門七葉圖其於枝分脈散不可勝數李氏革隋太上告以受命之符由是尊祖奉册與國同休故得芝壇蘂殿羅布四裔三洞科格自正一至大洞凡七等籙有一百二十階科有二千四百律有一千二百戒有一千二百仍以四輔真經以佐之為從凡入聖之門助國治身之業五季之衰道教微弱星辨霓襟逃難解散經籍亡逸宫宇摧頽巋然獨存者唯亳州太清宫矣次有北邙陽臺陽輔慶唐數觀尚有典刑天台衡湘豫章灊嶽不甚淩毀山東即鄰於掃地矣鄙以頑固粗通道教嘗遇至人朂以整綴從事荆州難得經書每想台嶠融峯恨無羽翼癸卯歲有陽臺道士劉君名若拙曵䇿南來延於所居劉君精熟法教因得口授入道儀式冠服品位編為一卷聊備所闕他年更睹大教别俟校勘之是歲九月二十六日荆南葆光子孫夷中集
