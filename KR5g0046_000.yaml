body:
  text: 初入道儀凡初欲學道男七歲號録生弟子女十嵗號南生弟子始授訓師門性行稍淳與授三戒五戒漸止葷血自此後不更婚嫁如巳成夫婦者男稱清真弟子女稱清信弟子常依科齋戒兼行黃赤交接之道能便斷得即為佳也其童男女秉持至十五歲方與詣師請求出家捨俗者不拘少長稟承戒律稍精方求入道誓戒三師稱智慧十戒弟子戴二儀冠黃綬衣七條素裙七幅靸鞋而巳次遷經法於十部大乘之內精一帙業成後授初真八十一戒授竟及保舉戒師七人稱太上初真弟子號白簡道士冠七真冠披黃褐文左九右十白裳黃裙九幅檀香木簡玄履鋪黃坐壇始入靖誦經思神行道次後不選年代經業轉精明錬法式方參洞經初詣三師保舉五人請授正一盟威籙二十四品正一部中别有一百二十階總出黃道枝葉是隂教輔助太陽也正一天師子嗣師諱衡系師諱魯散行此法皆是針藥符術禁呪之道小求福祐以療生民即今世上所行雜法亦有籙文非上真所修所謂白黑道也此中言黃赤者即陽道之法頥行也法象天地制治萬神隂陽律𪎗之候人鬼區分之序上禳天災下助王化俾帝王延期益算反朴還淳其次大地生民能奉此道者可以洗心畏罪免其夭橫其有夫婦者今選時日順隂陽行交接即所育男女免感悖戾淫濁之氣亦欲令其保身愛精不妄貪淫乃上聖兹愍拯濟之方使並屬正一部中之所行也授正一籙後方可以為人章醮為帝王封署山嶽辟召妖毒朝拜星辰以銓律候稱太上正一盟威弟子係天師某治某氣祭酒所稱治氣者取生月生日所主不同赤天三五步綱元命真人臣某凡道士未受經法通稱小兆可也冠玄冠朱帔二十四條黃裳蒼裙佩炎光火玉佩帶斬邪威神劒佩黃神越章印綬木雕鋪八卦壇所授經業正一法文經一百二十卷大章三百六十通小章一千二百通朝天醮儀三百座修真要十卷玉經三卷指要三卷太靈隂陽推遷𪎗六十卷禁呪文五卷按摩通精文三卷修元命真文一千字禹步星綱一卷以前正一所行皆在三界內所言十部大乘者多述罪福𡨚對説有説空凡一千卷巳來修正一道成告白真官遷齋上室洞神部道士自正一授金剛洞神籙此乃上三皇法非此劫三皇稱太上洞神法師如捨俗入道者自此夫婦隔絶不茹葷血也冠交泰冠絳褐黃裳丹裙玄履執白簡佩青光玉佩四道帶皇極洞神印綬佩隂陽斬魔劒華陽巾方勝帽坐九宫辰象壇參洞神十二部經髙玄部道士亦云髙上紫虛自修洞神有功後遷授太上髙玄籙稱太上紫虛髙玄弟子髙玄法師遊玄先生臣某姓名冠五嶽冠碧帔三十二條白裳黃裙玄履執長生木簡坐四氣壇素光丹纓佩帶五老交真印綬佩金剛洞清劒戴簏秀巾咸昌帽參究道德經西升經玉𪎗經妙真經寶光經枕中經存思神圖太上文節解內解自然齋法儀道德威儀一百五十條道德律五百條道德戒一百八十三科升玄部道士自髙玄部遷授太上升玄籙稱太上靈寶升玄內教弟子升玄真一法師無上等等光明真人臣某姓名冠芙蓉冠緑帔四十二條素裳丹裙玄履白簡素文壇逍遙巾月紗帽參授升玄籙一卷升玄誓戒三百條明真科三卷玉匱律三卷升天劵一道升玄朝禮儀一卷升玄經十卷到此觀六度梵氣即三界外上清境非同釋氏梵天也中盟洞玄部道士自升玄遷授中盟籙九卷計三十六階九劵思微定志劵金馬驛程劵五帝解形劵自然劵大明劵三皇劵水官解七祖劵升天劵解地根劵稱太上靈寶洞玄弟子無上洞玄法師東嶽先生青帝真人臣某姓名戴逺遊冠五色紫帔絳綃裳丹青裙朱履五辰紫色壇青玉交文佩佩八景金真印帶陽光洞神劒服朝天帽即舊呼南朝帽也三辰巾參靈寶洞玄經一十二部三洞部道士自修洞玄部遷授三洞寶籙二十四階計二十四卷劵亦二十四道金鈕九雙銀鐶一十二對金龍一對玉魚一對玉龜一玉馬一蒼玉簡一黃玉簡一玄玉簡一龍頭金刀一雙稱三洞法師東嶽青帝真人升玄先生臣某姓名冠合景冠青霞帔四十九條丹光裳黃裙朱履坐召真壇黃玉佩三辰印銷魔劒服緑華巾五嶽帽授三洞經教九真科法自此明錬所業棄諸有為動合真妙方遷大洞上法大洞部道士自修三洞法後次參上清金闕清精選法應為得道者稱上清大洞三景弟子無上三洞法師東嶽真人道德先生臣某姓名冠紫宸通精冠九色離羅帔紫裳丹文裙執瑶笏朱履坐震靈壇佩九光玉佩帶無上畢道印綬帶景精劒服黃寧帽授三官解祖考契斷地根劵升天劵五帝大魔合保舉劵三十二天帝君識功劵飛步諸法金丹大訣自此以畢法相次傳與世之學道者一世傳一人升黃壇告九天歃血歃即取自身血也分劵斷契以金魚玉龍赤玉圭圎瑶告誓萬靈方傳上法傳法之後始有回車之道功行圓滿與弟子告别造素木車一乘弟子親侍駕旋掃車迹入所在名山修行至山門谷口方焚此車從此師一向修金闕後聖飛升之道此出三界也永不入世間也居山道士居山道士冠平氣冠山水雲霞衲帔黃布裳布裙白履草屨坐七星壇佩二禁印東西二禁伏神劒玄巾此所行之道各據所得自務幽寂不救世人教文所謂山林寒棲道士也洞淵道士此道稱三昧法師冠通玄冠青文帔三十一條丹裳黃裙玄履執簡坐黃文壇佩洞淵五部印帶洞光劒所行洞淵三昧法其法上辟飛天之魔中治五氣下絶萬妖亦多救世也北帝太玄道士此道稱上清北帝太玄弟子冠星紀冠玄羽服白裳黃裙玄履坐召靈壇執簡佩酆都印帶斬鬼劒授北帝籙二卷伏魔經三卷天蓬經十卷北帝禁呪經三卷飛玄羽章經十卷北帝降靈召魂經三卷北帝雷公法一卷酆都要籙三卷傳鬼䇿三卷北帝三部符一卷北帝朝儀一卷治六天鬼神辟邪禳禍之事也女官部其儀式參授諸法籙與男官一般參大乘經法者稱太上全真女弟子臣某姓名冠三葉玄冠服關霞十二條裏青表黃有帶繫右肩素裳黃裙握節靸鞋正一盟威女官稱玄都正一盟威女弟子係天師君門下某治某氣赤天三五步綱元童臣某姓名冠洞隂冠黃霞帔二十四條紅文裳黃裙玄履執簡坐八卦壇所謂赤天三五者大凡日月運行皆依黃赤二道號曰二景凡真人掌黃赤道事以正隂陽用日月星宫為治所也更有白道法自月一日至望為白為明自十六日至晦為黑為暗道民或求小小福祐以白即祈月以黑即祈星於是有黑白之道黑白之説此二道卑於黃赤也洞神女官稱太上洞神女弟子洞靈元妃臣某姓名冠朱陽冠朱帔三十二條黃裳丹裙玄履執簡坐九宫壇髙玄女官稱太上髙玄女弟子紫虛童君臣某姓名冠遊玄冠黃褐碧裳素裙玄履執簡坐青壇升玄女官稱太上升玄女弟子無上內教真一靈真妃云小真臣某姓名冠四玄冠碧霞帔黃裳丹裙玄履執簡坐緑壇中盟女官稱太上靈寶洞玄女弟子亦稱洞玄法師東嶽夫人臣某姓名冠芙蓉冠紫褐碧裳丹裙執簡佩陽光劒白旒珠佩三道元虛印綬坐五氣壇三洞女官稱上清三洞女弟子無上三洞法師東嶽蒼靈夫人臣某姓名冠連雲冠朱褐青裳緑裙玄履執簡坐四神壇佩青玉佩白旒帶三洞印綬九真劒上清女官稱上清大洞三景女弟子奉行無上三洞法師東嶽蒼靈元君臣某姓名冠玄靈飛鳳冠五色雲霞帔青裳紅紗裙朱履坐震靈壇執簡其於回車入山之法一切與男官同居山女道士稱大道女弟子臣某姓名冠二氣冠衲帔二十四條青絹裳黃布裙草履坐八景壇執簡三洞修道儀
