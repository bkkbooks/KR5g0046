body:
  text: 初入道儀凡初欲學道男七𡻕號錄生弟子女十𡻕號南生弟子始授訓師門性行稍淳與授三戒五戒漸止葷血自此後不更婚嫁如已成夫婦者男稱清眞弟子女稱清信弟子常依科齋戒兼行黃赤交接之道能便斷得卽爲佳也其童男女秉持至十五𡻕方與詣師請求出家捨俗者不拘少長禀承戒律稍精方求入道誓戒三師稱智慧十戒弟子戴二儀冠黃綬衣七條素裙七幅靸鞋而已次遷經法於十部大乘之內精一帙業成後授初眞八十一戒授竟及保舉戒師七人稱太上初眞弟子號白簡道士冠七眞冠披黃褐文左九右十白裳黃裙九幅檀香木簡玄履鋪黃坐壇始入靖誦經思神行道次後不選年代經業轉精明鍊法式方參洞經初詣三師保舉五人請授正一盟威籙二十四品正一部中别有一百二十階總出黃道枝葉是陰教輔助太陽也正一天師子嗣師諱衡系師諱魯散行此法皆是鍼藥符術禁咒之道小求福祐以療生民卽今世上所行雜法亦有籙文非上眞所修所謂白黑道也此中言黃赤者卽陽道之法順行也法象天地制治萬神陰陽律厯之候人鬼區分之序上禳天災下助王化俾帝王延期益筭反樸還淳其次大地生民能奉此道者可以洗心畏罪免其夭橫其有夫婦者今選時日順陰陽行交接卽所育男女免感悖戾淫濁之氣亦欲令其保身愛精不妄貪淫乃上聖慈愍拯濟之方使並屬正一部中之所行也授正一籙後方可以爲人章醮爲帝王封署山嶽辟召妖毒朝拜星辰以銓律候稱太上正一盟威弟子係天師某治某氣祭酒所稱治氣者取生月生日所主不同赤天三五步綱元命眞人臣某凡道士未受經法通稱小兆可也冠玄冠朱帔二十四條黃裳蒼裙佩炎光火玉佩帶斬邪威神劍佩黃神越章印綬木雕鋪八卦壇所授經業正一法文經一百二十卷大章三百六十通小章一千二百通朝天醮儀三百座修眞要十卷玉經三卷指要三卷太靈陰陽推遷厯六十卷禁咒文五卷按摩通精文三卷修元命眞文一千字禹步星綱一卷以前正一所行皆在三界内所言十部大乘者多述罪福𡨚對說有說空凡一千卷已來修正一道成告白眞官遷齋上室洞神部道士自正一授金剛洞神籙此乃上三皇法非此劫三皇稱太上洞神法師如捨俗入道者自此夫婦隔絕不茹葷血也冠交泰冠絳褐黃裳丹裙玄履執白簡佩青光玉佩四道帶皇極洞神印綬佩陰陽斬魔劍華陽巾方勝帽坐九宫辰象壇參洞神十二部經高玄部道士亦云高上紫虛自修洞神有功後遷授太上高玄籙稱太上紫虛高玄弟子高玄法師遊玄先生臣某姓名冠五嶽冠碧帔三十二條白裳黃裙玄履執長生木簡坐四氣壇素光丹纓佩帶五老交眞印綬佩金剛洞清劍戴簏秀巾咸昌帽參究道德經西昇經玉厯經妙眞經寶光經枕中經存思神圖太上文節解内解自然齋法儀道德威儀一百五十條道德律五百條道德戒一百八十三科昇玄部道士自高玄部遷授太上昇玄籙稱太上靈寶昇玄内教弟子昇玄眞一法師無上等等光明眞人臣某姓名冠芙蓉冠緑帔四十二條素裳丹裙玄履白簡素文壇逍遙巾月紗帽參授昇玄籙一卷昇玄誓戒三百條明眞科三卷玉匱律三卷昇天劵一道昇玄朝禮儀一卷昇玄經十卷到此觀六度梵氣卽三界外上清境非同釋氏梵天也中盟洞玄部道士自昇玄遷授中盟籙九卷計三十六階九劵思微定志劵金馬驛程劵五帝解形劵自然劵大明劵三皇劵水官解七祖劵昇天劵解地根劵稱太上靈寶洞玄弟子無上洞玄法師東嶽先生青帝眞人臣某姓名戴遠遊冠五色紫帔絳綃裳丹青裙朱履五辰紫色壇青玉交文佩佩八景金眞印帶陽光洞神劍服朝天帽卽舊呼南朝帽也三辰巾參靈寶洞玄經一十二部三洞部道士自修洞玄部遷授三洞寶籙二十四階計二十四卷劵亦二十四道金鈕九雙銀鐶一十二對金龍一對玉魚一對玉龜一玉馬一蒼玉簡一黃玉簡一玄玉簡一龍頭金刀一雙稱三洞法師東嶽青帝眞人昇玄先生臣某姓名冠合景冠青霞帔四十九條丹光裳黃裙朱履坐召眞壇黃玉佩三辰印銷魔劒服緑華巾五嶽帽授三洞經教九眞科法自此明鍊所業弃諸有爲動合眞妙方遷大洞上法大洞部道士自修三洞法後次參上清金闕清精選法應爲得道者稱上清大洞三景弟子無上三洞法師東嶽眞人道德先生臣某姓名冠紫宸通精冠九色離羅帔紫裳丹文裙執瑤笏朱履坐震靈壇佩九光玉佩帶無上畢道印綬帶景精劍服黃寧帽授三官解祖考契斷地根劵昇天劵五帝大魔合保舉劵三十二天帝君識功劵飛步諸法金丹大訣自此以畢法相次傳與世之學道者一世傳一人昇黃壇告九天歃血歃卽取自身血也分劵斷契以金魚玉龍赤玉珪圓瑤告誓萬靈方傳上法傳法之後始有迴車之道功行圓滿與弟子吿别造素木車一乘弟子親侍駕旋掃車跡入所在名山修行至山門谷口方焚此車從此師一向修金闕後聖飛昇之道此出三界也永不入世間也居山道士居山道士冠平氣冠山水雲霞衲帔黃布裳布裙白履草屨坐七星壇佩二禁印東西二禁伏神劍玄巾此所行之道各據所得自務幽寂不救世人教文所謂山林寒棲道士也洞淵道士此道稱三昧法師冠通玄冠青文帔三十一條丹裳黃裙玄履執簡坐黃文壇佩洞淵五部印帶洞光劍所行洞淵三昧法其法上辟飛天之魔中治五氣下絕萬妖亦多救世也北帝太玄道士此道稱上清北帝太玄弟子冠星紀冠玄羽服白裳黃裙玄履坐召靈壇執簡佩酆都印帶斬鬼劍授北帝籙二卷伏魔經三卷天蓬經十卷北帝禁咒經三卷飛玄羽章經十卷北帝降靈召魂經三卷北帝雷公法一卷酆都要籙三卷傳鬼策三卷北帝三部符一卷北帝朝儀一卷治六天鬼神辟邪禳禍之事也女官部其儀式參授諸法籙與男官一般參大乘經法者稱太上全眞女弟子臣某姓名冠三葉玄冠服關霞十二條裏青表黃有帶繫右肩素裳黃裙握節靸鞋正一盟威女官稱玄都正一盟威女弟子係天師君門下某治某氣赤天三五步綱元童臣某姓名冠洞陰冠黃霞帔二十四條紅文裳黃裙玄履執簡坐八卦壇所謂赤天三五者大凡日月運行皆依黃赤二道號曰二景凡眞人掌黃赤道事以正陰陽用日月星宫爲治所也更有白道法自月一日至望爲白爲明自十六日至晦爲黑爲暗道民或求小小福祐以白卽祈月以黑卽祈星於是有黑白之道黑白之說此二道卑於黃赤也洞神女官稱太上洞神女弟子洞靈元妃臣某姓名冠朱陽冠朱帔三十二條黃裳丹裙玄履執簡坐九宫壇高玄女官稱太上高玄女弟子紫虛童君臣某姓名冠遊玄冠黃褐碧裳素裙玄履執簡坐青壇昇玄女官稱太上昇玄女弟子無上內教眞一靈眞妃云小眞臣某姓名冠四玄冠碧霞帔黃裳丹裙玄履執簡坐緑壇中盟女官稱太上靈寶洞玄女弟子亦稱洞玄法師東嶽夫人臣某姓名冠芙蓉冠紫褐碧裳丹裙執簡佩陽光劍白旒珠佩三道元虛印綬坐五氣壇三洞女官稱上清三洞女弟子無上三洞法師東嶽蒼靈夫人臣某姓名冠連雲冠朱褐青裳緑裙玄履執簡坐四神壇佩青玉佩白旒帶三洞印綬九眞劍上清女官稱上清大洞三景女弟子奉行無上三洞法師東嶽蒼靈元君臣某姓名冠玄靈飛鳳冠五色雲霞帔青裳紅紗裙朱履坐震靈壇執簡其於迴車入山之法一切與男官同居山女道士稱大道女弟子臣某姓名冠二氣冠衲帔二十四條青絹裳黃布裙草履坐八景壇執簡三洞修道儀
