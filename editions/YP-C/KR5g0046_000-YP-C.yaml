front:
  text: 三洞修道儀夫道以元精一氣陶育三才爰及萬物有情無情咸禀此氣得之者外可以輔元化内可以登至眞昧之者反淳以爲漓攬清以爲濁汨亂神性淪爲下鬼何神仙之可冀乎雖大象無形不可得於視聽然悟證者實資於傳授按上清大有妙經至道始自玄聖傳與神眞神眞傳與靈仙此三眞口口相授未有文字至赤明開圖方著文篆迨龍漢延康漸降靈寶金闕玉格自是乃睹出教之科文此時太平靈寶行於諸天洎列紀君始傳於黃帝靈寶既隱封五符於鍾山至大禹理水受之疏達之後復藏之於石碽震水所謂靈寶或隱或顯是也後聖黃老帝君傳洞神經誥符圖號黃老道德於世世之隱逸者默修其道洞神漸替東漢末三天法師張君方受太上正一科法先是蜀當鬼宿之分下有二十四治陰司以調二十四氣北邙一治在洛陽者以伊闕爲陸渾戎地以鎭陰都也後爲六天魔鬼占據號曰鬼營天師以正一法而降制焉至今列爲陰局鬼爲陰吏天師之裔世傳一人卽信州龍虎山張家也大約此教盛於吳蜀迄于魏世有嵩嶽寇謙之天師復大弘闡厯于唐季其間道業彰灼者江左卽有若簡寂先生陸公修靜中宇卽有若隱眞趙先生潘天師澄源李先生司馬天師宗元先生吳天師牛先生葉孤雲葉廣寒二天師希和李先生皆傳教之光明者具載道門七葉圖其於枝分脈散不可勝數李氏革隋太上告以受命之符由是尊祖奉冊與國同休故得芝壇蘂殿羅布四裔三洞科格自正一至大洞凡七等籙有一百二十階科有二千四百律有一千二百戒有一千二百仍以四輔眞經以佐之爲從凡入聖之門助國治身之業五季之衰道教微弱星弁霓襟逃難解散經籍亡逸宫宇摧頽巋然獨存者唯亳州太清宫矣次有北邙陽臺陽輔慶唐數觀尚有典刑天台衡湘豫章𤄵嶽不甚淩毀山東卽隣於掃地矣鄙以頑固粗通道教嘗遇至人朂以整綴從事荆州難得經書每想台嶠融峯恨無羽翼癸卯𡻕有陽臺道士劉君名若拙曳策南來延於所居劉君精熟法教因得口授入道儀式冠服品位編爲一卷聊備所闕他年更睹大教别俟校勘之是𡻕九月二十六日荆南葆光子孫夷中集
